<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBusSound – nastavení karty</title>
<style>
/* Vzhled TANK (vychozi): olivova pancerova deska, mosaz, cervena paka. */
:root{
  --skrin:#2B3029;
  --deska:#353B32;
  --deska-2:#3E4539;
  --hrana:#4E574A;
  --hrana-2:#454D41;
  --jamka:#252A22;
  --jamka-2:#2E332B;
  --lista:#262A24;
  --hover:#4A5244;
  --nadpis:#EEF1EA;
  --text:#D8DDD1;
  --tlum:#939C8D;
  --tlum-2:#7D8578;
  --mosaz:#C8A23C;
  --mosaz-tma:#7A6327;
  --akcent-text:#2B2614;
  --akcent-slaby:rgba(200,162,60,.28);
  --paka:#B3402B;
  --paka-hrana:#8C3221;
  --paka-hover:#C44B33;
  --paka-text:#FFF4EF;
  --zelen:#7FA35E;
  --chyba:#E0775F;
  --stitek-1:#4A4430;
  --stitek-2:#3A3524;
  --stitek-text:#B9A66A;
  --info-bg:rgba(38,43,35,.88);
  --clona:rgba(22,25,20,.84);
  --hlaska:#3F4A37;
  --hlaska-hrana:#67784F;
  --vlna:#8E9A84;
  --vlna-nova:#C8A23C;
  --budik:#E3DCC8;
  --budik-ryska:#23271F;
  --budik-text:#4A5142;
  --budik-rucka:#B3402B;
  --budik-cerv:rgba(179,64,43,.75);
  --graf-v:#C8A23C;
  --graf-o:#B3402B;
  --pismo:"Avenir Next Condensed","Avenir Next","Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --pismo-nadpis:"Stencil","Stencil Std","Avenir Next Condensed","Arial Narrow",sans-serif;
  --nyt:radial-gradient(circle at 45% 40%, #737C68 0 1.3px, #2A2F27 2.2px, transparent 2.9px);
}
/* Vzhled TRUCK: grafit a chrom, jantar smerovek, cervena koncovych svetel. */
body.truck{
  --skrin:#1D2024;
  --deska:#2A2E34;
  --deska-2:#353A42;
  --hrana:#4A5059;
  --hrana-2:#3D424A;
  --jamka:#1A1D21;
  --jamka-2:#24282D;
  --lista:#16181B;
  --hover:#424851;
  --nadpis:#F3F5F7;
  --text:#DDE1E6;
  --tlum:#98A0AA;
  --tlum-2:#7A818B;
  --mosaz:#F2A51A;
  --mosaz-tma:#8C5F0E;
  --akcent-text:#2A1B02;
  --akcent-slaby:rgba(242,165,26,.28);
  --paka:#C8372D;
  --paka-hrana:#8F241D;
  --paka-hover:#DA4236;
  --paka-text:#FFF3F1;
  --zelen:#6FB37A;
  --chyba:#F07A62;
  --stitek-1:#3A3F47;
  --stitek-2:#25292F;
  --stitek-text:#C9CDD3;
  --info-bg:rgba(29,32,36,.9);
  --clona:rgba(14,16,18,.86);
  --hlaska:#2F3640;
  --hlaska-hrana:#5C6673;
  --vlna:#8F98A3;
  --vlna-nova:#F2A51A;
  --budik:#15171A;
  --budik-ryska:#E8EBEE;
  --budik-text:#9AA2AC;
  --budik-rucka:#F2A51A;
  --budik-cerv:rgba(200,55,45,.85);
  --graf-v:#F2A51A;
  --graf-o:#E2574C;
  --pismo:"Avenir Next Condensed","Avenir Next","Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --pismo-nadpis:"DIN Condensed","DIN Alternate","Bahnschrift SemiCondensed","Avenir Next Condensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--skrin);
  color:var(--text);
  font-family:var(--pismo);
  font-size:15px;line-height:1.4;
  font-variant-numeric:tabular-nums;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mosaz);outline-offset:2px}

/* ---------- hlavicka ---------- */
.lista{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 18px;background:var(--lista);border-bottom:1px solid var(--hrana);
}
.lista h1{margin:0;font-size:21px;font-weight:600;letter-spacing:.01em;color:var(--nadpis)}
.lista h1 span{color:var(--tlum);font-weight:500}
.stav{flex:1 1 220px;font-size:14px;color:var(--tlum);min-width:0}
.stav b{color:var(--text);font-weight:600}
.stav .neulozeno{color:var(--mosaz)}
.stav .ulozeno{color:var(--zelen)}
.akce{display:flex;gap:8px;flex-wrap:wrap}

button{
  background:var(--deska-2);border:1px solid var(--hrana);border-radius:5px;
  padding:6px 13px;cursor:pointer;letter-spacing:.01em;
}
button:hover{background:var(--hover)}
button:disabled{opacity:.4;cursor:not-allowed}
button.hlavni{background:var(--paka);border-color:var(--paka-hrana);color:var(--paka-text)}
button.hlavni:hover{background:var(--paka-hover)}
button.tichy{background:transparent}

/* ---------- mrizka ---------- */
main{
  max-width:1240px;margin:0 auto;padding:16px 18px 40px;
  display:grid;gap:14px;
  grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);
  grid-template-areas:"kanaly prava" "prevod prevod";
  align-items:start;
}
.prava{grid-area:prava;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-areas:"kanaly" "prava" "prevod"}
}
section{background:var(--deska);border:1px solid var(--hrana);border-radius:8px;padding:14px 16px}
section h2{margin:0 0 2px;font-size:17px;font-weight:600;color:var(--nadpis)}
section .pozn{margin:0 0 12px;font-size:13.5px;color:var(--tlum);max-width:68ch}
#kanaly{grid-area:kanaly}
#prevod{grid-area:prevod}

/* ---------- kanaly a zvuky ---------- */
.funkce{display:grid;grid-template-columns:118px 92px minmax(0,1fr);gap:4px 12px;
  padding:9px 0;border-top:1px solid var(--hrana-2);align-items:center}
.funkce:first-of-type{border-top:0}
.funkce .nazev{font-size:16px;font-weight:600;color:var(--nadpis)}
.funkce .nazev small{display:block;font-size:12.5px;font-weight:400;color:var(--tlum)}
.stitek{
  display:flex;align-items:center;border:1px solid var(--mosaz-tma);border-radius:6px;
  background:linear-gradient(var(--stitek-1),var(--stitek-2));height:44px;overflow:hidden;
}
.stitek.dup{border-color:var(--chyba)}
.stitek span{font-size:12px;color:var(--stitek-text);padding:0 2px 0 8px}
.stitek input{
  width:100%;min-width:0;background:transparent;border:0;text-align:center;
  font-size:28px;font-weight:600;color:var(--mosaz);padding:0 4px 0 0;
  -moz-appearance:textfield;appearance:textfield;
}
.stitek input::-webkit-inner-spin-button{opacity:.5}
.zvuky{display:flex;flex-direction:column;gap:6px;min-width:0}
.zvuk{display:grid;grid-template-columns:96px minmax(80px,1fr) auto auto auto;gap:8px;align-items:center;min-width:0}
.zvuk .jm{font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zvuk .jm small{display:block;font-size:12px;color:var(--tlum)}
.vlna{position:relative;height:34px;border-radius:4px;background:var(--jamka);border:1px solid var(--hrana-2);overflow:hidden;min-width:0}
.vlna canvas{width:100%;height:100%;display:block}
.vlna .info{position:absolute;left:4px;bottom:3px;font-size:11.5px;line-height:1.3;color:var(--tlum);
  background:var(--info-bg);padding:0 5px;border-radius:3px;white-space:nowrap;pointer-events:none}
.vlna.novy{border-color:var(--mosaz-tma)}
.vlna.novy .info{color:var(--mosaz)}
.vlna.prazdna .info{color:var(--tlum-2);left:50%;transform:translateX(-50%);bottom:auto;top:8px;background:none}
.vlna.chyba{border-color:var(--chyba)}
.vlna.chyba .info{color:var(--chyba)}
.hrat{width:36px;padding:6px 0;text-align:center}
.hrat.hraje{background:var(--mosaz);color:var(--akcent-text);border-color:var(--mosaz)}
.bezzvuku{font-size:13px;color:var(--tlum)}
@media (max-width:620px){
  .funkce{grid-template-columns:minmax(0,1fr) 92px}
  .funkce .zvuky{grid-column:1 / -1}
  .zvuk{grid-template-columns:56px minmax(50px,1fr) auto auto auto;gap:5px}
  .zvuk button{padding:6px 8px}
  .zvuk .jm small{display:none}
  .lista{padding:8px 12px}
  main{padding:12px 10px 32px}
  section{padding:12px}
}
.upozorneni{margin:10px 0 0;font-size:13.5px;color:var(--chyba);min-height:0}
.upozorneni:empty{display:none}

/* ---------- vystup a kalibrace ---------- */
.radek{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}
.radek > label{color:var(--tlum);font-size:14px}
.prepinac{display:inline-flex;border:1px solid var(--hrana);border-radius:5px;overflow:hidden}
.prepinac button{border:0;border-radius:0;background:transparent;padding:5px 11px;color:var(--tlum)}
.prepinac button + button{border-left:1px solid var(--hrana)}
.prepinac button[aria-pressed="true"]{background:var(--mosaz);color:var(--akcent-text)}
.posuv{display:flex;align-items:center;gap:10px;flex:1;max-width:240px}
.posuv input{flex:1}
input[type=range]{accent-color:var(--paka);height:22px}
.hodnota{color:var(--mosaz);font-weight:600;min-width:52px;text-align:right}
.cislo{width:78px;background:var(--jamka);border:1px solid var(--hrana-2);border-radius:4px;padding:4px 7px;text-align:right}
.cislo.spatne{border-color:var(--chyba)}
.kal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.kal label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--tlum)}
.kal .cislo{width:100%}
.volitelne{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--tlum)}
.volitelne input[type=number]{margin-left:auto}

/* ---------- prevodovka a simulator ---------- */
.prevod-obal{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px}
@media (max-width:900px){.prevod-obal{grid-template-columns:1fr}}
.parametry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px;align-content:start}
@media (max-width:560px){.parametry{grid-template-columns:1fr}}
.par label{display:flex;justify-content:space-between;font-size:14px;color:var(--tlum)}
.par input{width:100%}
.sim{background:var(--jamka-2);border:1px solid var(--hrana-2);border-radius:8px;padding:12px}
.sim-horni{display:flex;gap:14px;align-items:center}
#budik{flex:0 0 auto}
.ukazatele{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.stupen{display:flex;align-items:baseline;gap:10px}
.stupen .c{font-size:44px;font-weight:600;line-height:.95;color:var(--mosaz);min-width:46px;text-align:center;
  border:1px solid var(--mosaz-tma);border-radius:5px;padding:3px 2px;transition:background .12s}
.stupen .c.radi{background:var(--akcent-slaby)}
.stupen .p{font-size:13px;color:var(--tlum)}
.pruh .h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tlum)}
.pruh .d{height:8px;background:var(--jamka);border:1px solid var(--hrana-2);border-radius:2px;overflow:hidden;margin-top:2px}
.pruh .v{height:100%;width:0;background:var(--mosaz)}
.pruh.vzad .v{background:#7E8CA0}
.paka-plynu{margin:10px 0 2px}
.paka-plynu .sk{display:flex;justify-content:space-between;font-size:12px;color:var(--tlum)}
.paka-plynu input{width:100%}
.paka-plynu.ne{opacity:.4}
.sim-tl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.sim-tl label{font-size:13px;color:var(--tlum)}
#graf{width:100%;height:56px;display:block;margin-top:10px;background:var(--jamka);border:1px solid var(--hrana-2);border-radius:4px}

/* ---------- hlaska ---------- */
#hlaska{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;
  max-width:min(640px,92vw);padding:9px 14px;border-radius:6px;font-size:14.5px;
  background:var(--hlaska);border:1px solid var(--hlaska-hrana);box-shadow:0 6px 24px rgba(0,0,0,.5);
  transition:opacity .3s;opacity:0;pointer-events:none}
#hlaska.ukaz{opacity:1}
#hlaska.chyba{background:#4E2E26;border-color:#94513F}
/* ---------- editor zvuku ---------- */
.editor{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
  background:var(--clona);padding:16px}
.editor.otevren{display:flex}
.ed-panel{width:min(1120px,100%);max-height:100%;overflow:auto;background:var(--deska);
  border:1px solid var(--hrana);border-radius:10px;padding:14px 16px;box-shadow:0 18px 60px rgba(0,0,0,.55)}
.ed-hlava{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.ed-hlava h2{margin:0;font-size:19px;font-weight:600;color:var(--nadpis)}
.ed-hlava h2 small{font-size:14px;font-weight:400;color:var(--tlum);margin-left:6px}
.ed-cas{flex:1;text-align:right;font-size:14px;color:var(--tlum);white-space:nowrap}
.ed-cas b{color:var(--mosaz);font-weight:600}
.ed-plocha{position:relative;border:1px solid var(--hrana-2);border-radius:6px;background:var(--jamka);overflow:hidden;
  touch-action:none;cursor:text}
#edVlna{display:block;width:100%;height:230px}
#edPrehled{display:block;width:100%;height:38px;margin-top:6px;border:1px solid var(--hrana-2);border-radius:4px;
  background:var(--jamka);cursor:pointer;touch-action:none}
.ed-radek{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.ed-radek .mezera{flex:1}
.ed-skupina{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px;
  border:1px solid var(--hrana-2);border-radius:6px;background:var(--jamka-2)}
.ed-skupina > span{font-size:13px;color:var(--tlum);margin-right:2px}
.ed-skupina label{font-size:13.5px;color:var(--tlum);display:flex;align-items:center;gap:5px}
.ed-skupina select{background:var(--jamka);border:1px solid var(--hrana-2);border-radius:4px;padding:3px 4px}
.ed-skupina input[type=range]{width:120px}
#edPrehrat{min-width:96px}
#edPrehrat.hraje{background:var(--mosaz);color:var(--akcent-text);border-color:var(--mosaz)}
.ed-napoveda{margin:8px 0 0;font-size:12.5px;color:var(--tlum)}
@media (max-width:620px){#edVlna{height:180px}.ed-cas{text-align:left}}

/* ---------- dialog uprostred okna ---------- */
.dialog{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  background:var(--clona);padding:20px}
.dialog.otevren{display:flex}
.dl-panel{width:min(520px,100%);background:var(--deska);border:1px solid var(--hrana);border-radius:12px;
  padding:26px 28px 22px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.dl-ikona{width:74px;height:74px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:600;line-height:1}
.dl-ikona.ok{background:rgba(127,163,94,.18);border:2px solid var(--zelen);color:var(--zelen)}
.dl-ikona.pozor{background:rgba(200,162,60,.15);border:2px solid var(--mosaz);color:var(--mosaz)}
.dl-ikona.chyba{background:rgba(224,119,95,.15);border:2px solid var(--chyba);color:var(--chyba)}
.dl-panel h2{margin:0 0 8px;font-size:25px;font-weight:600;color:var(--nadpis);line-height:1.2}
.dl-text{font-size:16px;color:var(--text);max-width:44ch;margin:0 auto}
.dl-text p{margin:.5em 0}
.dl-text .tlum{color:var(--tlum);font-size:14.5px}
.dl-text ul{list-style:none;padding:0;margin:12px auto;display:inline-block;text-align:left}
.dl-text li{padding:3px 0 3px 22px;position:relative}
.dl-text li::before{content:"✓";position:absolute;left:0;color:var(--zelen)}
.dl-text li small{color:var(--tlum);font-size:13.5px}
.dl-tl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.dl-tl button{font-size:16px;padding:9px 20px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
/* ---------- uvodni okno a pretazeni karty ---------- */
.uvod{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
  background:var(--clona);padding:90px 20px 20px}
.uvod.otevren{display:flex}
.uv-panel{width:min(600px,100%);background:var(--deska);border:1px solid var(--hrana);border-radius:14px;
  padding:34px 36px 24px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.uv-panel svg{display:block;margin:0 auto 14px}
.uv-panel h2{margin:0 0 8px;font-size:30px;font-weight:600;color:var(--nadpis);line-height:1.15}
.uv-panel p{margin:0 auto 20px;max-width:46ch;font-size:16.5px}
.uv-panel .velke{font-size:19px;padding:12px 30px;border-radius:7px}
.uv-pretah{margin:22px 0 14px;padding:16px 14px;border:2px dashed var(--hrana);border-radius:10px;color:var(--tlum);font-size:15px}
.pretah-nad .uv-pretah{border-color:var(--mosaz);color:var(--mosaz)}
.pretah{position:fixed;inset:10px;z-index:45;display:none;align-items:center;justify-content:center;pointer-events:none;
  border:3px dashed var(--mosaz);border-radius:16px;background:var(--skrin);box-shadow:0 0 0 10px var(--skrin)}
.pretah-nad .pretah{display:flex}
.pretah div{font-size:30px;font-weight:600;color:var(--mosaz)}
.log-stav{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
#diagnostika.zapnuto{border-color:var(--mosaz)}
#diagnostika .pozor{margin:8px 0 0;font-size:13.5px;color:var(--mosaz);display:none}
#diagnostika .cast.zapnuto .pozor{display:block}
#diagnostika .cast + .cast{margin-top:14px;padding-top:12px;border-top:1px solid var(--hrana)}
#diagnostika ol{margin:6px 0 0;padding-left:20px;font-size:13.5px;color:var(--tlum);max-width:68ch}
#diagnostika ol li{margin:2px 0}
.dl-text ol{text-align:left;margin:10px auto;padding-left:22px;max-width:44ch}
.dl-text ol li{padding:2px 0}
.dl-panel.siroky{width:min(860px,100%)}
.dl-panel.siroky .dl-text{max-width:none}
.dl-text pre{text-align:left;margin:10px 0 0;max-height:58vh;overflow:auto;padding:10px 12px;background:var(--skrin);
  border:1px solid var(--hrana);border-radius:6px;font:12.5px/1.45 Menlo,Consolas,monospace;color:var(--text);white-space:pre-wrap;word-break:break-word}
/* ---------- typ modelu: tematicke prvky ---------- */
.lista h1{display:flex;align-items:center;gap:10px;font-family:var(--pismo-nadpis)}
.lista h1 span{font-family:var(--pismo)}
.ikona{display:block;flex:0 0 auto}
.ikona-truck{display:none}
body.truck .ikona-tank{display:none}
body.truck .ikona-truck{display:block}
section h2,.dl-panel h2,.uv-panel h2{font-family:var(--pismo-nadpis)}
/* tank: sablonove pismo, nyty v rozich pancerovych desek, maskovani v pozadi */
body:not(.truck) .lista h1,body:not(.truck) section h2,body:not(.truck) .dl-panel h2,body:not(.truck) .uv-panel h2{font-weight:400;letter-spacing:.05em}
body:not(.truck) section,body:not(.truck) .dl-panel,body:not(.truck) .uv-panel,body:not(.truck) .ed-panel{
  background-image:var(--nyt),var(--nyt),var(--nyt),var(--nyt);background-repeat:no-repeat;background-size:8px 8px;
  background-position:5px 5px,right 5px top 5px,left 5px bottom 5px,right 5px bottom 5px}
body:not(.truck){background-image:
  radial-gradient(ellipse 420px 240px at 10% 20%,rgba(78,90,58,.32),transparent 70%),
  radial-gradient(ellipse 360px 300px at 85% 35%,rgba(24,28,22,.5),transparent 70%),
  radial-gradient(ellipse 480px 260px at 55% 88%,rgba(82,76,52,.26),transparent 70%),
  radial-gradient(ellipse 300px 200px at 30% 62%,rgba(20,24,18,.4),transparent 70%);background-attachment:fixed}
body:not(.truck) .lista{background:linear-gradient(#2E3329,var(--lista));border-bottom:2px solid #1C1F1A;
  box-shadow:inset 0 -1px 0 #4E574A}
/* truck: chromova hrana, jantarova stredova cara silnice, pristrojovka */
body.truck .lista{background:linear-gradient(#24272C,var(--lista));border-bottom:0}
body.truck .lista::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:#2B2F34 repeating-linear-gradient(90deg,var(--mosaz) 0 34px,transparent 34px 62px) 0 2px/100% 2px no-repeat}
body.truck section,body.truck .dl-panel,body.truck .uv-panel,body.truck .ed-panel{
  border-top:2px solid #9AA3AE;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 0 rgba(0,0,0,.4)}
body.truck .lista h1,body.truck section h2{letter-spacing:.02em}
body.truck{background-image:linear-gradient(180deg,#22252A 0,var(--skrin) 340px)}
body.truck .stitek input{text-shadow:0 0 8px rgba(242,165,26,.35)}
body.truck main{padding-top:22px}
/* ---------- sada zvuku ---------- */
.sada{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;margin:0 0 6px;
  border:1px solid var(--hrana-2);border-radius:6px;background:var(--jamka-2)}
.sada > span:first-child{color:var(--tlum);font-size:14px}
.sada b{color:var(--mosaz);font-weight:600;font-size:16px}
.sada .mezera{flex:1}
.sada small{color:var(--tlum);font-size:13px}
.dl-sady{display:flex;flex-direction:column;gap:6px;margin:14px auto 0;max-width:380px;max-height:46vh;overflow:auto}
.dl-sady button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:16px;padding:9px 14px;text-align:left}
.dl-sady button small{color:var(--tlum);font-size:13px}
.dl-sady button.aktivni{border-color:var(--mosaz)}
.dl-vstup{display:block;width:100%;max-width:360px;margin:14px auto 0;padding:9px 12px;font-size:17px;
  background:var(--jamka);border:1px solid var(--hrana);border-radius:6px;text-align:center}
.dl-vstup:focus{border-color:var(--mosaz);outline:0}
.dl-chyba{color:var(--chyba);font-size:14px;min-height:1.2em;margin:6px 0 0}
.jazyk{display:inline-flex;border:1px solid var(--hrana);border-radius:5px;overflow:hidden}
.jazyk button{border:0;border-radius:0;background:transparent;padding:5px 10px;color:var(--tlum);font-size:14px}
.jazyk button + button{border-left:1px solid var(--hrana)}
.jazyk button[aria-pressed="true"]{background:var(--deska-2);color:var(--nadpis)}
.rezim button[aria-pressed="true"]{background:var(--mosaz);color:var(--akcent-text)}
</style>
</head>

function vychozi(){
  const s = {
    vystup:{zarizeni:"i2s", reproduktor:"oba", hlasitost:100},
    kanaly:{},
    kalibrace:{min:172, stred:992, max:1811, stred_plyn:null, stred_vez:null},
    prevodovka:{},
    diagnostika:{log:false, mapovat:false},
  };
  for (const f of FUNKCE) s.kanaly[f.k] = f.ch;
  for (const p of PREVOD) s.prevodovka[p.k] = p.v;
  return s;
}

function cislo(x){
  if (x == null) return NaN;
  x = String(x).trim().replace(",", ".");
  if (!/^-?\d+(\.\d+)?$/.test(x)) return NaN;
  return Number(x);
}

// Cte nastaveni.txt stejne jako engine (ini.cpp + nastaveni.cpp).
// Vraci {s, pozn[]}: co je spatne nebo navic, nahradi vychozi hodnotou.
function nactiIni(text){
  const s = vychozi(), pozn = [];
  const hodnoty = {};
  let sekce = "";
  text.replace(/^﻿/, "").split(/\r?\n/).forEach((radek, i) => {
    const r = radek.replace(/[#;].*$/, "").trim();
    if (!r) return;
    if (r.startsWith("[")){
      if (!r.endsWith("]")){ pozn.push(t("nRadekSekce", {r:i + 1})); return; }
      sekce = r.slice(1, -1).replace(/\s/g, "").toLowerCase();
      return;
    }
    const eq = r.indexOf("=");
    if (eq < 0){ pozn.push(t("nRadekRovna", {r:i + 1})); return; }
    const k = r.slice(0, eq).trim().toLowerCase(), v = r.slice(eq + 1).trim().toLowerCase();
    if (!k || !v){ pozn.push(t("nRadekPrazdny", {r:i + 1})); return; }
    hodnoty[(sekce ? sekce + "." : "") + k] = v;
  });
  const vem = (k) => { const v = hodnoty[k]; delete hodnoty[k]; return v; };

  let v = vem("vystup.zarizeni");
  if (v === "i2s" || v === "jack") s.vystup.zarizeni = v; else if (v) pozn.push(t("nVystup", {v}));
  v = vem("vystup.reproduktor");
  if (["oba","levy","pravy"].includes(v)) s.vystup.reproduktor = v; else if (v) pozn.push(t("nRepro", {v}));
  v = vem("vystup.hlasitost");
  if (v != null){ const n = cislo(v); if (Number.isInteger(n) && n >= 0 && n <= 100) s.vystup.hlasitost = n; else pozn.push(t("nHlas", {v})); }

  for (const f of FUNKCE){
    v = vem("kanaly." + f.k);
    if (v == null) continue;
    const n = cislo(v);
    if (Number.isInteger(n) && n >= 1 && n <= 16) s.kanaly[f.k] = n;
    else pozn.push(t("nKanal", {k:f.k, v, d:f.ch}));
  }

  const mn = vem("kalibrace.min"), md = vem("kalibrace.stred"), mx = vem("kalibrace.max");
  if (mn != null || md != null || mx != null){
    const a = cislo(mn), b = cislo(md), c = cislo(mx);
    if ([a,b,c].every(Number.isInteger) && a >= 0 && a < b && b < c && c <= 2047 && c - a >= 200){
      s.kalibrace.min = a; s.kalibrace.stred = b; s.kalibrace.max = c;
    } else pozn.push(t("nKal"));
  }
  for (const k of ["stred_plyn", "stred_vez"]){
    v = vem("kalibrace." + k);
    if (v == null) continue;
    const n = cislo(v);
    if (Number.isInteger(n) && n > s.kalibrace.min && n < s.kalibrace.max) s.kalibrace[k] = n;
    else pozn.push(t("nStred", {k, v}));
  }

  for (const p of PREVOD){
    v = vem("prevodovka." + p.k);
    if (v == null) continue;
    const n = cislo(v);
    if (!isNaN(n) && n >= p.min - 1e-9 && n <= p.max + 1e-9 && (!p.cele || Number.isInteger(n))) s.prevodovka[p.k] = n;
    else pozn.push(t("nPrev", {k:p.k, v, a:p.min, b:p.max, d:p.v}));
  }
  v = vem("diagnostika.log");
  if (v === "ano" || v === "1") s.diagnostika.log = true;
  else if (v != null && v !== "ne" && v !== "0") pozn.push(t("nLog", {v}));
  v = vem("diagnostika.mapovat");
  if (v === "ano" || v === "1") s.diagnostika.mapovat = true;
  else if (v != null && v !== "ne" && v !== "0") pozn.push(t("nMap", {v}));
  for (const k of Object.keys(hodnoty)) pozn.push(t("nNeznama", {k}));
  return {s, pozn};
}

function txtCislo(n){
  // max 2 desetinna mista, bez zbytecnych nul; tecka (engine bere i carku)
  return String(Math.round(n * 100) / 100);
}

// Vyrobi nastaveni.txt ve stejne podobe jako vzorovy soubor.
function vyrobIni(s, kdy){
  const K = Object.assign({}, KOMENTARE[LANG], REZIM === "truck" ? KOMENTARE_TRUCK[LANG] : {}), k = s.kanaly, c = s.kalibrace, p = s.prevodovka;
  const pad = (x, n) => (x + " ".repeat(n)).slice(0, Math.max(n, String(x).length));
  const kom = (radky) => radky.map(r => "# " + r).join("\n");
  const kan = (f) => `${pad(f, 9)} = ${pad(String(k[f]), 5)} # ${K["k_" + f]}`;
  const prv = (f) => `${pad(f, 12)} = ${pad(txtCislo(p[f]), 6)} # ${K["p_" + f]}`;
  return `# ================================================================
#  ${K.nadpis}
# ================================================================
#  ${K.ulozeno.replace("{kdy}", kdy)}
${K.uvod.map(r => "#  " + r).join("\n")}


[vystup]

${kom(K.zarizeni)}

${kom(K.repro)}

${kom(K.hlas)}

[kanaly]

${kom(K.kanaly)}
${["motor", "plyn", "vez", "kulomet", "delo", "pozadi", "hlasitost"].map(kan).join("\n")}

${kom(K.kal)}

stred = ${c.stred}
max   = ${c.max}

// Chyby, kvuli kterym by engine hodnoty zahodil.
function kontrola(s){
  const ch = [], c = s.kalibrace;
  const cela = (n, a, b) => Number.isInteger(n) && n >= a && n <= b;
  if (!cela(c.min,0,2047) || !cela(c.stred,0,2047) || !cela(c.max,0,2047)) ch.push({kal:true, t:t("kChybaCela")});
  else {
    if (!(c.min < c.stred && c.stred < c.max)) ch.push({kal:true, t:t("kChybaPoradi")});
    if (c.max - c.min < 200) ch.push({kal:true, t:t("kChybaRozsah")});
  }
  for (const k of ["stred_plyn", "stred_vez"]){
    const n = c[k];
    if (n != null && !(Number.isInteger(n) && n > c.min && n < c.max))
      ch.push({stred:true, t:t(k === "stred_plyn" ? "kChybaStredPlyn" : "kChybaStredVez")});
  }
  for (const f of FUNKCE) if (!cela(s.kanaly[f.k], 1, 16)) ch.push({t:t("kChybaKanal", {f:t("f_" + f.k)})});
  return ch;
}

function duplicity(s){
  const podle = {};
  for (const f of FUNKCE) (podle[s.kanaly[f.k]] ||= []).push(f.k);
  return Object.entries(podle).filter(([, n]) => n.length > 1).map(([c, n]) => ({ch:Number(c), funkce:n}));
}

// Nazev slozky sady: neprazdny, bez znaku zakazanych ve FAT a bez tecky na zacatku.
function platnyNazevSady(n){
  n = String(n || "").trim();
  if (!n || n.length > 64 || n.startsWith(".") || /[\/\\:*?"<>|\x00-\x1f]/.test(n) || /[. ]$/.test(n)) return null;
  return n;
}

const KONFIG_SADY = "sada.json";
function konfigSady(s){
  return {verze:1, rezim:REZIM, kanaly:Object.assign({}, s.kanaly),
          kalibrace:Object.assign({}, s.kalibrace), prevodovka:Object.assign({}, s.prevodovka)};
}
// Vrati kopii nastaveni s hodnotami ze sady. Co je mimo meze enginu, zustane
// puvodni a prida se do pozn (klice, prelozi je volajici).
function pouzijKonfigSady(s, k){
  const n = JSON.parse(JSON.stringify(s)), pozn = [];
  if (!k || typeof k !== "object") return {s:n, rezim:null, pozn};
  const rezim = k.rezim === "truck" || k.rezim === "tank" ? k.rezim : null;
  const cela = (x, a, b) => Number.isInteger(x) && x >= a && x <= b;
  if (k.kanaly && typeof k.kanaly === "object"){
    for (const f of FUNKCE){
      if (!(f.k in k.kanaly)) continue;
      if (cela(k.kanaly[f.k], 1, 16)) n.kanaly[f.k] = k.kanaly[f.k]; else pozn.push({typ:"kanal", k:f.k});
    }
  }
  const c = k.kalibrace;
  if (c && typeof c === "object"){
    if ([c.min, c.stred, c.max].every(x => cela(x, 0, 2047)) && c.min < c.stred && c.stred < c.max && c.max - c.min >= 200){
      n.kalibrace.min = c.min; n.kalibrace.stred = c.stred; n.kalibrace.max = c.max;
      for (const x of ["stred_plyn", "stred_vez"])
        n.kalibrace[x] = Number.isInteger(c[x]) && c[x] > c.min && c[x] < c.max ? c[x] : null;
    } else pozn.push({typ:"kal"});
  }
  if (k.prevodovka && typeof k.prevodovka === "object"){
    for (const p of PREVOD){
      if (!(p.k in k.prevodovka)) continue;
      const v = k.prevodovka[p.k];
      if (typeof v === "number" && v >= p.min - 1e-9 && v <= p.max + 1e-9 && (!p.cele || Number.isInteger(v))) n.prevodovka[p.k] = v;
      else pozn.push({typ:"prev", k:p.k});
    }
  }
  return {s:n, rezim, pozn};
}

/* ---------- WAV a ZIP ---------- */
function vyrobWav(f32, rate){
  const n = f32.length, buf = new ArrayBuffer(44 + n * 2), d = new DataView(buf);
  const w = (o, x) => { for (let i = 0; i < x.length; i++) d.setUint8(o + i, x.charCodeAt(i)); };
  w(0, "RIFF"); d.setUint32(4, 36 + n * 2, true); w(8, "WAVE");
  w(12, "fmt "); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
  d.setUint32(24, rate, true); d.setUint32(28, rate * 2, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true);
  w(36, "data"); d.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++){
    const v = Math.round(f32[i] * 32767);
    d.setInt16(44 + i * 2, v > 32767 ? 32767 : v < -32768 ? -32768 : v, true);
  }
  return new Uint8Array(buf);
}

const CRC_T = (() => { const x = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; x[n] = c >>> 0; } return x; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

// ZIP bez komprese (WAV se stejne skoro nekomprimuji). soubory: [{jmeno, data:Uint8Array}]
function vyrobZip(soubory, datum = new Date()){
  const enc = new TextEncoder(), casti = [], centr = [];
  const dosCas = ((datum.getHours() << 11) | (datum.getMinutes() << 5) | (datum.getSeconds() >> 1)) & 0xFFFF;
  const dosDat = (((datum.getFullYear() - 1980) << 9) | ((datum.getMonth() + 1) << 5) | datum.getDate()) & 0xFFFF;
  let ofs = 0;
  for (const s of soubory){
    const jm = enc.encode(s.jmeno), crc = crc32(s.data), n = s.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034B50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(8, 0, true); h.setUint16(10, dosCas, true); h.setUint16(12, dosDat, true);
    h.setUint32(14, crc, true); h.setUint32(18, n, true); h.setUint32(22, n, true);
    h.setUint16(26, jm.length, true); h.setUint16(28, 0, true);
    casti.push(new Uint8Array(h.buffer), jm, s.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014B50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(10, 0, true); c.setUint16(12, dosCas, true); c.setUint16(14, dosDat, true);
    c.setUint32(16, crc, true); c.setUint32(20, n, true); c.setUint32(24, n, true);
    c.setUint16(28, jm.length, true); c.setUint32(42, ofs, true);
    centr.push(new Uint8Array(c.buffer), jm);
    ofs += 30 + jm.length + n;
  }
  const velC = centr.reduce((a, b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054B50, true); e.setUint16(8, soubory.length, true); e.setUint16(10, soubory.length, true);
  e.setUint32(12, velC, true); e.setUint32(16, ofs, true);
  return new Blob([...casti, ...centr, new Uint8Array(e.buffer)], {type:"application/zip"});
}

/* ---------- prevodovka (stejna jako prevodovka.cpp) ---------- */
const PODRAZ = 0.85;
function novaPrevodovka(){ return {rychlost:0, smer:1, stupen:1, otacky:0}; }
function vrchol(B, P, g){
  if (B.smer < 0) return P.zpatecka / 100;
  return 1 / Math.pow(P.pomer, P.stupnu - g);
}
// vraci 0 = neradil, 1 = nahoru, -1 = dolu
function krokPrevodovky(B, P, plyn, dt){
  const vzad = plyn < -0.02, vel = Math.abs(plyn);
  if (B.rychlost < 0.01){
    if (vzad && B.smer > 0){ B.smer = -1; B.stupen = 1; }
    else if (!vzad && vel > 0.02 && B.smer < 0){ B.smer = 1; B.stupen = 1; }
  }
  const sedi = (vzad && B.smer < 0) || (!vzad && B.smer > 0);
  const strop = B.smer > 0 ? 1 : P.zpatecka / 100;
  const cil = sedi ? vel * strop : 0;
  const zm = (cil > B.rychlost ? strop / P.rozjezd : strop / P.dobeh) * dt;
  B.rychlost = cil > B.rychlost ? Math.min(cil, B.rychlost + zm) : Math.max(cil, B.rychlost - zm);
  if (B.rychlost < 0.001) B.rychlost = 0;
  let radil = 0;
  if (B.smer > 0){
    while (B.stupen < P.stupnu && B.rychlost > vrchol(B, P, B.stupen)){ B.stupen++; radil = 1; }
    while (B.stupen > 1 && B.rychlost < vrchol(B, P, B.stupen - 1) * PODRAZ){ B.stupen--; radil = -1; }
  } else B.stupen = 1;
  if (radil > 0 && P.propad > 0) B.otacky = Math.max(0, B.otacky * (1 - P.propad / 100));
  const cilOt = Math.min(1, B.rychlost / vrchol(B, P, B.stupen));
  const tau = Math.max(0.02, P.navrat / 1000);
  B.otacky += (cilOt - B.otacky) * (1 - Math.exp(-dt / tau));
  return radil;
}

/* ---------- upravy zvuku (editor) - vse nad mono Float32Array, 44100 Hz ---------- */
const ED_RATE = 44100;
const SPOJ = Math.round(ED_RATE * 0.002);	// prolnuti na miste strihu (2 ms)

// Nejblizsi pruchod nulou do +-5 ms (strih v nule necvaka).
function kNule(d, i){
  const max = Math.round(ED_RATE * 0.005);
  i = Math.max(0, Math.min(d.length, Math.round(i)));
  for (let k = 0; k <= max; k++){
    for (const j of [i - k, i + k]){
      if (j > 0 && j < d.length && ((d[j - 1] <= 0 && d[j] >= 0) || (d[j - 1] >= 0 && d[j] <= 0))) return j;
    }
  }
  return i;
}
// Vymaze usek [a,b). Misto strihu kratce prolne, aby necvaklo.
function smazUsek(d, a, b){
  a = Math.max(0, Math.min(d.length, a)); b = Math.max(a, Math.min(d.length, b));
  const out = new Float32Array(d.length - (b - a));
  out.set(d.subarray(0, a), 0); out.set(d.subarray(b), a);
  const K = Math.min(SPOJ, a, d.length - b);
  for (let i = 0; i < K; i++){
    const w = (i + 1) / (K + 1);
    out[a - K + i] = d[a - K + i] * (1 - w) + d[b - K + i] * w;
  }
  return out;
}
function ponechUsek(d, a, b){ return d.slice(Math.max(0, a), Math.min(d.length, b)); }
function upravUsek(d, a, b, f){
  const out = d.slice(); a = Math.max(0, a); b = Math.min(d.length, b);
  const n = Math.max(1, b - a - 1);
  for (let i = a; i < b; i++) out[i] = f(d[i], (i - a) / n);
  return out;
}
const tichoUsek = (d, a, b) => upravUsek(d, a, b, () => 0);
const nabehUsek = (d, a, b) => upravUsek(d, a, b, (v, x) => v * Math.sin(x * Math.PI / 2) ** 2);
const dobehUsek = (d, a, b) => upravUsek(d, a, b, (v, x) => v * Math.cos(x * Math.PI / 2) ** 2);
function zesilUsek(d, a, b, dB){ const g = Math.pow(10, dB / 20); return upravUsek(d, a, b, v => Math.max(-1, Math.min(1, v * g))); }
function spicka(d, a = 0, b = d.length){ let m = 0; for (let i = a; i < b; i++){ const v = Math.abs(d[i]); if (v > m) m = v; } return m; }
// Spicka na -1 dB (0,891) - stejna rezerva jako limiter v enginu.
function normalizujUsek(d, a, b){ const m = spicka(d, a, b); return m > 0 ? upravUsek(d, a, b, v => v * 0.891 / m) : d.slice(); }
function bezDC(d){ let s = 0; for (let i = 0; i < d.length; i++) s += d[i]; const m = s / (d.length || 1); return d.map(v => Math.max(-1, Math.min(1, v - m))); }
// Plynula smycka: poslednich N vzorku se prolne do prvnich N a konec se zkrati.
function plynulaSmycka(d, N){
  N = Math.min(Math.round(N), Math.floor(d.length / 3));
  if (N < 2) return d.slice();
  const out = d.slice(0, d.length - N), z = d.length - N;
  for (let i = 0; i < N; i++){
    const w = Math.sin((i + 0.5) / N * Math.PI / 2) ** 2;
    out[i] = d[i] * w + d[z + i] * (1 - w);
  }
  return out;
}

/* Dialog uprostred okna. tlacitka: [{t:"text", v:hodnota, hlavni:true, fokus:true}],
   prvni = zruseni (Esc). Predvybrane (Enter) je tlacitko s fokus, jinak hlavni. */
let dialogKonec = null;
const dialogOtevren = () => dialogKonec !== null;
function dialog({ikona = "ok", nadpis, text, tlacitka, siroky = false}){
  document.querySelector("#dialog .dl-panel").classList.toggle("siroky", siroky);
  const znak = {ok:"✓", pozor:"!", chyba:"✕"}[ikona];
  $("dlIkona").className = "dl-ikona " + ikona; $("dlIkona").textContent = znak;
  $("dlNadpis").textContent = nadpis;
  $("dlText").innerHTML = text;
  const obal = $("dlTl"); obal.innerHTML = "";
  const predtim = document.activeElement;
  clearTimeout(hlaskaCas); $("hlaska").className = "";	// at rusi jen jedna vec
  return new Promise(hotovo => {
    dialogKonec = (v) => { dialogKonec = null; $("dialog").classList.remove("otevren"); if (predtim && predtim.focus) predtim.focus(); hotovo(v); };
    for (const b of tlacitka){
      const el = document.createElement("button");
      el.textContent = b.t; if (b.hlavni) el.className = "hlavni"; if (b.fokus) el.dataset.fokus = "1";
      el.onclick = () => dialogKonec(b.v);
      obal.appendChild(el);
    }
    dialog.zruseni = tlacitka[0].v;
    // tlacitka primo v textu (napr. seznam sad): data-v je vracena hodnota
    $("dlText").querySelectorAll("button[data-v]").forEach(el => el.onclick = () => dialogKonec(el.dataset.v));
    // vstup: Enter = hlavni tlacitko
    const vstup = $("dlText").querySelector("input");
    const hlavni = tlacitka.find(b => b.hlavni);
    dialog.enter = vstup && hlavni ? hlavni.v : undefined;
    $("dialog").classList.add("otevren");
    if (vstup){ vstup.focus(); vstup.select(); }
    else (obal.querySelector("[data-fokus]") || obal.querySelector(".hlavni") || obal.lastChild).focus();
  });
}
document.addEventListener("keydown", e => {
  if (!dialogOtevren()) return;
  if (e.key === "Escape"){ e.preventDefault(); e.stopImmediatePropagation(); dialogKonec(dialog.zruseni); }
  else if (e.key === "Enter" && e.target.tagName === "INPUT" && dialog.enter !== undefined){ e.preventDefault(); e.stopImmediatePropagation(); dialogKonec(dialog.enter); }
  else if (e.key === " " && e.target.tagName !== "BUTTON" && e.target.tagName !== "INPUT"){ e.preventDefault(); e.stopImmediatePropagation(); }
  else e.stopImmediatePropagation();		// klavesy editoru pod dialogem nefunguji
}, true);

async function zapisStranku(){
  if (!karta) return;
  try{
    if (karta.queryPermission && (await karta.queryPermission({mode:"readwrite"})) !== "granted") return;
    const w = await (await karta.getFileHandle(STRANKA, {create:true})).createWritable();

  }catch(e){}

function vykresliVlnu(jm){
  const z = zvuky[jm], el = $("vl_" + jm), cv = el.querySelector("canvas"), info = el.querySelector(".info");
  const g = cv.getContext("2d"), w = cv.width = Math.max(120, Math.round(el.clientWidth * (window.devicePixelRatio || 1))), h = cv.height = Math.round(34 * (window.devicePixelRatio || 1));
  g.clearRect(0, 0, w, h);
  el.classList.toggle("novy", !!(z && z.wav));
  el.classList.toggle("prazdna", !z || (!z.buf && !z.chyba));
  el.classList.toggle("chyba", !!(z && z.chyba));
  $("hr_" + jm).disabled = !(z && z.buf);
  $("up_" + jm).disabled = !(z && z.buf);
  if (!z || !z.buf){ info.textContent = z && z.chyba ? t("nejdePrecist") : t("chybiVyber"); return; }
  const d = z.buf.getChannelData(0), krok = d.length / w;
  g.fillStyle = z.wav ? B["vlna-nova"] : B.vlna;
  for (let x = 0; x < w; x++){
    let mn = 1, mx = -1;
    const a = Math.floor(x * krok), b = Math.min(d.length, Math.floor((x + 1) * krok) + 1);
    for (let i = a; i < b; i += Math.max(1, (b - a) >> 6)){ const v = d[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
    const y1 = (1 - mx) * h / 2, y2 = (1 - mn) * h / 2;
    g.fillRect(x, y1, 1, Math.max(1, y2 - y1));
  }
  const s = z.buf.duration;
  const delka = s >= 60 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}` : fmt(s, 1) + " s";
  info.textContent = `${delka} · ${SLOTY[jm].smycka ? t("smycka") : t("jednou")}${z.wav ? " · " + (z.zdroj === "upraveno" ? t("upraveno") : t("novy", {z:z.zdroj})) : ""}`;
}

// Dekoduje libovolny podporovany format primo na 44100 Hz a smicha do mona.
async function dekoduj(data){
  const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const c = new Off(1, 1, 44100);
  const b = await new Promise((ok, chyba) => {
    const p = c.decodeAudioData(data, ok, chyba);
    if (p && p.then) p.then(ok, chyba);
  });
  const mono = new Float32Array(b.length);
  for (let k = 0; k < b.numberOfChannels; k++){
    const ch = b.getChannelData(k);
    for (let i = 0; i < mono.length; i++) mono[i] += ch[i] / b.numberOfChannels;
  }
  const out = audio().createBuffer(1, mono.length, 44100);
  out.copyToChannel ? out.copyToChannel(mono, 0) : out.getChannelData(0).set(mono);
  return out;
}

async function nactiText(soubor){ return new TextDecoder("utf-8").decode(await soubor.arrayBuffer()); }

async function nactiZeSouboru(c){
  // c.najdi(cesta) -> File | null ; cesta napr. "nastaveni.txt", "sounds/turret.wav"
  // c.slozky(cesta) -> nazvy podslozek
  ctecka = c;
  const najdi = c.najdi;
  zastavNahled(); vypniSim();
  // volby stranky z karty: typ modelu, jazyk, sada
  aktivniSada = ""; sadaUpravena = false;
  const fs = await najdi(STRANKA);
  if (fs){
    try{
      const v = JSON.parse(await nactiText(fs));
      if (v.rezim === "tank" || v.rezim === "truck"){ nastavRezim(v.rezim); try{ localStorage.setItem("rezim", REZIM); }catch(e){} }
      if (v.jazyk === "cz" || v.jazyk === "en"){ nastavJazyk(v.jazyk); try{ localStorage.setItem("lang", LANG); }catch(e){} }
      if (typeof v.sada === "string") aktivniSada = platnyNazevSady(v.sada) || "";
      sadaUpravena = !!v.sadaUpravena && !!aktivniSada;
    }catch(e){}
  }
  prelozStatiku(); vykresliFunkce(); vykresliPrevodovku();
  const f = await najdi("nastaveni.txt");
  if (f){ posledniText = await nactiText(f); const r = nactiIni(posledniText); S = r.s; poznamkyNacteni = r.pozn; }
  else { posledniText = null; S = vychozi(); poznamkyNacteni = []; }
  const fl = await najdi("log.txt");
  logText = fl ? await nactiText(fl) : null;
  let nacteno = 0;
  const chybi = [];
  for (const jm of Object.keys(SLOTY)){
    const z = await najdi("sounds/" + jm + ".wav");
    if (!z){ zvuky[jm] = {buf:null, wav:null, chyba:null}; chybi.push(jm); continue; }
    try{
      const ab = await z.arrayBuffer(), bajty = new Uint8Array(ab.slice(0));	// dekodovani buffer odpoji
      zvuky[jm] = {buf:await dekoduj(ab), wav:null, bajty, zdroj:"karta", chyba:null}; nacteno++;
    }
    catch(e){ zvuky[jm] = {buf:null, wav:null, chyba:true}; }
  }
  zmeneno = false;
  // pole, ve kterem byl kurzor, by si nechalo starou hodnotu
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  obnovVse();
  hlaska(t(f ? "nacteno" : "nenacteno", {n:nacteno}) + (chybi.length ? t("chybiZvuky", {s:chybi.join(", ")}) : "") + ".", !f || chybi.length > 0);
}

// Chrome, Edge: karta jako FileSystemDirectoryHandle (z vyberu i z pretazeni) - uklada se rovnou na ni
async function otevriHandle(d){
  karta = d; kartaJmeno = d.name;
  await nactiZeSouboru({
    najdi: async cesta => {
      try{
        let h = d; const casti = cesta.split("/");
        for (const c of casti.slice(0, -1)) h = await h.getDirectoryHandle(c);
        return await (await h.getFileHandle(casti[casti.length - 1])).getFile();
      }catch(e){ return null; }
    },
    slozky: async cesta => {
      const v = [];
      try{
        let h = d;
        for (const c of cesta.split("/")) h = await h.getDirectoryHandle(c);
        for await (const [n, x] of h.entries()) if (x.kind === "directory" && !n.startsWith(".")) v.push(n);
      }catch(e){}
      return v;
    },
  });
  skryjUvod();
}
// Safari, Firefox: pretazena slozka jako FileSystemDirectoryEntry - jen cteni, uklada se ZIP
async function otevriEntry(koren){
  karta = null; kartaJmeno = koren.name;
  const seznamy = new Map();
  const cti = d => {
    if (!seznamy.has(d)) seznamy.set(d, new Promise((ok, chyba) => {
      const r = d.createReader(), vse = [];
      const dalsi = () => r.readEntries(a => { if (!a.length) ok(vse); else { vse.push(...a); dalsi(); } }, chyba);
      dalsi();
    }));
    return seznamy.get(d);
  };
  const polozka = async cesta => {
    let d = koren; const casti = cesta.toLowerCase().split("/");
    for (let i = 0; i < casti.length; i++){
      const e = (await cti(d)).find(x => x.name.toLowerCase() === casti[i]);
      if (!e || i === casti.length - 1) return e || null;
      if (!e.isDirectory) return null;
      d = e;
    }
    return null;
  };
  await nactiZeSouboru({
    najdi: async cesta => {
      try{ const e = await polozka(cesta); return e && e.isFile ? await new Promise((ok, chyba) => e.file(ok, chyba)) : null; }
      catch(e){ return null; }
    },
    slozky: async cesta => {
      try{
        const d = await polozka(cesta);
        return d && d.isDirectory ? (await cti(d)).filter(x => x.isDirectory && !x.name.startsWith(".")).map(x => x.name) : [];
      }catch(e){ return []; }
    },
  });
  skryjUvod();
}

// Safari a Firefox: jen cteni pres vyber slozky, ukladani pak pres ZIP
$("slozka").onchange = async e => {
  const soubory = [...e.target.files]; e.target.value = "";
  if (!soubory.length) return;
  const koren = soubory[0].webkitRelativePath.split("/")[0];
  kartaJmeno = koren; karta = null;
  await nactiZeSouboru({
    najdi: async cesta => soubory.find(f => f.webkitRelativePath.toLowerCase() === (koren + "/" + cesta).toLowerCase()) || null,
    slozky: async cesta => {
      const pre = (koren + "/" + cesta + "/").toLowerCase(), v = new Set();
      for (const f of soubory){
        const p = f.webkitRelativePath;
        if (!p.toLowerCase().startsWith(pre)) continue;
        const zbytek = p.slice(pre.length), i = zbytek.indexOf("/");
        if (i > 0 && !zbytek.startsWith(".")) v.add(zbytek.slice(0, i));
      }
      return [...v];
    },
  });
  skryjUvod();
};

/* ---------- pretazeni karty kamkoli do okna ---------- */
const nesouSoubory = e => !!(e.dataTransfer && [...e.dataTransfer.types].includes("Files"));
const lzePustit = () => !edOtevren() && !dialogOtevren();
let pretahCas = null;
function pretah(ano){
  clearTimeout(pretahCas);
  document.body.classList.toggle("pretah-nad", ano);
  // dragleave pri prechodu mezi prvky neni spolehlive - zhasnout, kdyz dragover prestane chodit
  if (ano) pretahCas = setTimeout(() => pretah(false), 250);
}
window.addEventListener("dragover", e => {
  if (!nesouSoubory(e)) return;
  e.preventDefault();				// jinak by prohlizec soubor otevrel
  e.dataTransfer.dropEffect = lzePustit() ? "copy" : "none";
  if (lzePustit()) pretah(true);
});
window.addEventListener("drop", e => {
  if (!nesouSoubory(e)) return;
  e.preventDefault();
  pretah(false);
  if (!lzePustit()) return;
  const polozka = [...e.dataTransfer.items].find(i => i.kind === "file");
  if (!polozka) return;
  // obe je nutne ziskat hned v udalosti, pozdeji uz polozka neplati
  const handle = polozka.getAsFileSystemHandle ? polozka.getAsFileSystemHandle() : null;
  const entry = polozka.webkitGetAsEntry ? polozka.webkitGetAsEntry() : null;
  (async () => {
    let h = null;
    if (handle){ try{ h = await handle; }catch(err){ h = null; } }
    const slozka = (h && h.kind === "directory") || (!h && entry && entry.isDirectory);
    if (!slozka){ hlaska(t("pretahniSlozku"), true); return; }
    if (!(await muzuZahodit())) return;
    try{
      if (h) await otevriHandle(h); else await otevriEntry(entry);
    }catch(err){ hlaska(t("nejdeOtevrit", {e:err.message}), true); }
  })();
});

  const text = vyrobIni(S, kdy());

  if (window.showDirectoryPicker){
    try{

          tlacitka:[{t:t("ok"), v:0, hlavni:true}]});

async function nactiSadu(nazev){
  if (Object.keys(zvuky).some(k => zvuky[k].wav)){
    const v = await dialog({ikona:"pozor", nadpis:t("dlSadaZahoditNadpis"), text:t("dlSadaZahoditText"),
      tlacitka:[{t:t("dlPonechat"), v:false, hlavni:true, fokus:true}, {t:t("dlSadaZahodit"), v:true}]});
    if (!v) return;
  }
  zastavNahled(); vypniSim();
  const primo = await zapisPovolen();
  const zvukyDir = primo ? await karta.getDirectoryHandle("sounds", {create:true}) : null;
  const chybi = [], nactene = [];
  for (const jm of Object.keys(SLOTY)){
    const f = await ctecka.najdi(`sounds/${nazev}/${jm}.wav`);
    if (!f){ chybi.push(jm); continue; }
    const ab = await f.arrayBuffer(), bajty = new Uint8Array(ab.slice(0));
    let buf;
    try{ buf = await dekoduj(ab); }catch(e){ chybi.push(jm); continue; }
    if (primo){
      await zapisSoubor(zvukyDir, jm + ".wav", bajty);		// beze zmeny, bajt po bajtu
      zvuky[jm] = {buf, wav:null, bajty, zdroj:"karta", chyba:null};
    } else {
      zvuky[jm] = {buf, wav:bajty, bajty, zdroj:nazev, chyba:null};
    }
    nactene.push(jm);
    vykresliVlnu(jm);
  }
  aktivniSada = nazev; sadaUpravena = false;
  // nastaveni sady: typ modelu, kanaly, kalibrace, prevodovka
  let konfig = null;
  try{ const f = await ctecka.najdi(`sounds/${nazev}/${KONFIG_SADY}`); if (f) konfig = JSON.parse(await nactiText(f)); }catch(e){ konfig = null; }
  let textNast = "";
  if (konfig){
    const v = pouzijKonfigSady(S, konfig);
    S = v.s;
    if (v.rezim){ nastavRezim(v.rezim); try{ localStorage.setItem("rezim", REZIM); }catch(e){} }
    const opravy = v.pozn.map(x => x.typ === "kanal" ? t("sOpravaKanal", {k:x.k}) : x.typ === "kal" ? t("sOpravaKal") : t("sOpravaPrev", {k:x.k}));
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    prekresli();
    const rez = REZIM === "truck" ? "Truck" : "Tank";
    let zapsano = false;
    if (primo && kontrola(S).length === 0){
      const text = vyrobIni(S, kdy());
      await zapisSoubor(karta, "nastaveni.txt", new TextEncoder().encode(text));
      posledniText = text; poznamkyNacteni = []; zapsano = true;
    }
    textNast = t(zapsano ? "dlNactenaNast" : primo ? "dlNactenaNastNeulozeno" : "dlNactenaNastSafari", {r:rez}) +
               (opravy.length ? t("dlNactenaOpravy", {s:esc(opravy.join(", "))}) : "");
    if (zapsano) zmeneno = Object.keys(zvuky).some(k => zvuky[k].wav);
    else zmeneno = true;
  }
  if (!primo && nactene.length) zmena();
  obnovSadu(); obnovSim(); obnovStav();
  if (primo) await zapisStranku();
  await dialog({ikona:nactene.length ? "ok" : "chyba", nadpis:t("dlNactenaNadpis", {s:nazev}),
    text:`<ul>${nactene.map(jm => `<li>sounds/${jm}.wav <small>${t("s_" + jm)}, ${fmt(zvuky[jm].buf.duration, 1)} s</small></li>`).join("")}</ul>` +
      (primo ? t("dlNactenaText") : t("dlNactenaSafari")) + (chybi.length ? t("dlNactenaChybi", {s:chybi.join(", ")}) : "") + textNast,
    tlacitka:[{t:t("ok"), v:0, hlavni:true}]});
}

/* =====================================================================
   Simulator motoru
   ===================================================================== */
const SIM = {faze:"stoji", B:novaPrevodovka(), smycka:null, jednoraz:null, token:0, t:0, radiDo:0, demo:null, demoPoStartu:false, hist:[], rate:1, gain:null};
const plyn = $("plyn");

function simGain(){ const c = audio(); if (!SIM.gain){ SIM.gain = c.createGain(); SIM.gain.gain.value = 0.85; SIM.gain.connect(c.destination); } return SIM.gain; }
function jednou(buf, potom){
  const s = audio().createBufferSource(); s.buffer = buf; s.connect(simGain());
  const muj = ++SIM.token; s.onended = () => { if (muj === SIM.token) potom(); };
  SIM.jednoraz = s; s.start();
}
function zrusJednou(){ SIM.token++; if (SIM.jednoraz){ try{ SIM.jednoraz.stop(); }catch(e){} SIM.jednoraz = null; } }
function buf(jm){ return zvuky[jm] && zvuky[jm].buf; }

function nastartuj(){
  if (!buf("motor_run")) return;
  zastavNahled();
  plyn.value = 0; SIM.B = novaPrevodovka();
  if (buf("motor_start")){ SIM.faze = "start"; jednou(buf("motor_start"), dojed); obnovSim(); }
  else dojed();
}
function dojed(){
  zrusJednou(); SIM.faze = "jede"; SIM.rate = 1;
  const s = audio().createBufferSource(); s.buffer = buf("motor_run"); s.loop = true; s.connect(simGain()); s.start();
  SIM.smycka = s;
  if (SIM.demoPoStartu){ SIM.demoPoStartu = false; SIM.demo = {start:SIM.t}; }
  obnovSim();
}
function vypniMotor(){
  if (SIM.faze === "stoji") return;
  SIM.demo = null; SIM.demoPoStartu = false; zrusJednou();
  if (SIM.smycka){ try{ SIM.smycka.stop(); }catch(e){} SIM.smycka = null; }
  if (buf("motor_stop")){ SIM.faze = "stop"; jednou(buf("motor_stop"), doKlidu); obnovSim(); }
  else doKlidu();
}
function doKlidu(){ zrusJednou(); SIM.faze = "stoji"; SIM.B = novaPrevodovka(); SIM.rate = 1; plyn.value = 0; obnovSim(); }
function vypniSim(){ SIM.demo = null; SIM.demoPoStartu = false; if (SIM.faze !== "stoji"){ zrusJednou(); if (SIM.smycka){ try{ SIM.smycka.stop(); }catch(e){} SIM.smycka = null; } doKlidu(); } }

function obnovSim(){
  const ma = !!buf("motor_run"), b = $("btnMotor"), u = $("btnUkazka");
  if (SIM.faze === "stoji"){ b.textContent = t("nastartovat"); b.disabled = !ma; }
  else if (SIM.faze === "start"){ b.textContent = t("preskocitStart"); b.disabled = false; }
  else if (SIM.faze === "jede"){ b.textContent = t("vypnoutMotor"); b.disabled = false; }
  else { b.textContent = t("dobehBtn"); b.disabled = true; }
  u.disabled = !ma || SIM.faze === "stop";
  u.textContent = SIM.demo || SIM.demoPoStartu ? t("zastavitUkazku") : t("ukazka");
  b.title = ma ? "" : t("nejdrivRun");
}
$("btnMotor").onclick = () => { if (SIM.faze === "stoji") nastartuj(); else if (SIM.faze === "start") dojed(); else if (SIM.faze === "jede") vypniMotor(); };
$("btnUkazka").onclick = () => {
  if (SIM.demo || SIM.demoPoStartu){ SIM.demo = null; SIM.demoPoStartu = false; plyn.value = 0; obnovSim(); return; }
  if (SIM.faze === "stoji"){ SIM.demoPoStartu = true; nastartuj(); }
  else if (SIM.faze === "start") SIM.demoPoStartu = true;
  else if (SIM.faze === "jede") SIM.demo = {start:SIM.t};
  obnovSim();
};
const pusteno = () => { if ($("pruzina").checked && !SIM.demo) plyn.value = 0; };
plyn.addEventListener("pointerup", pusteno); plyn.addEventListener("pointercancel", pusteno); plyn.addEventListener("keyup", pusteno);
plyn.addEventListener("input", () => { if (SIM.demo){ SIM.demo = null; obnovSim(); } });

const SCENAR = [[0.4,0],[7,100],[9,100],[12.5,0],[14,0],[18,-100],[21,0],[22.5,0]];
function vedUkazku(){
  const x = SIM.t - SIM.demo.start;
  if (x > SCENAR[SCENAR.length - 1][0]){ SIM.demo = null; vypniMotor(); return; }
  let pc = 0, pv = 0;
  for (const [c, v] of SCENAR){ if (x <= c){ plyn.value = Math.round(pv + (v - pv) * (x - pc) / Math.max(0.001, c - pc)); break; } pc = c; pv = v; }
}

const budik = $("budik"), bg = budik.getContext("2d");
const graf = $("graf"), gg = graf.getContext("2d");
function platno(c, w, h){ const r = window.devicePixelRatio || 1; c.width = w * r; c.height = h * r; c.style.width = w + "px"; c.style.height = h + "px"; c.getContext("2d").setTransform(r, 0, 0, r, 0, 0); }
function rozmery(){ platno(budik, 132, 132); platno(graf, graf.clientWidth || 336, 56); for (const jm of Object.keys(SLOTY)) vykresliVlnu(jm); }
window.addEventListener("resize", rozmery);

function kresliBudik(){
  const R = 66, cx = 66, cy = 66, a0 = Math.PI * .75, roz = Math.PI * 1.5;
  bg.clearRect(0, 0, 132, 132);
  bg.beginPath(); bg.arc(cx, cy, R - 3, 0, Math.PI * 2); bg.fillStyle = B.budik; bg.fill();
  bg.lineWidth = 4; bg.strokeStyle = REZIM === "truck" ? "#8C949E" : "#1F231C"; bg.stroke();
  bg.beginPath(); bg.arc(cx, cy, R - 12, a0 + roz * .85, a0 + roz); bg.lineWidth = 7; bg.strokeStyle = B["budik-cerv"]; bg.stroke();
  for (let i = 0; i <= 10; i++){
    const a = a0 + roz * i / 10, vn = R - 8, vi = i % 5 ? R - 14 : R - 19;
    bg.beginPath(); bg.moveTo(cx + Math.cos(a) * vi, cy + Math.sin(a) * vi); bg.lineTo(cx + Math.cos(a) * vn, cy + Math.sin(a) * vn);
    bg.lineWidth = i % 5 ? 1 : 2; bg.strokeStyle = B["budik-ryska"]; bg.stroke();
  }
  bg.fillStyle = B["budik-text"]; bg.font = "11px 'Avenir Next Condensed','Arial Narrow',sans-serif"; bg.textAlign = "center";
  bg.fillText(t("otacky"), cx, cy + 26);
  if (SIM.faze === "start" || SIM.faze === "stop"){ bg.fillStyle = REZIM === "truck" ? B.mosaz : "#8E3322"; bg.font = "600 12px 'Avenir Next Condensed','Arial Narrow',sans-serif"; bg.fillText(SIM.faze === "start" ? t("dialStart") : t("dialStop"), cx, cy - 22); }
  const a = a0 + roz * Math.max(0, Math.min(1, SIM.B.otacky));
  bg.beginPath(); bg.moveTo(cx - Math.cos(a) * 8, cy - Math.sin(a) * 8); bg.lineTo(cx + Math.cos(a) * (R - 16), cy + Math.sin(a) * (R - 16));
  bg.lineWidth = 3; bg.lineCap = "round"; bg.strokeStyle = B["budik-rucka"]; bg.stroke();
  bg.beginPath(); bg.arc(cx, cy, 5, 0, Math.PI * 2); bg.fillStyle = REZIM === "truck" ? "#8C949E" : "#23271F"; bg.fill();
}
function kresliGraf(){
  const w = graf.clientWidth, h = 56, t0 = SIM.t - 10;
  gg.clearRect(0, 0, w, h);
  const x = q => (q - t0) / 10 * w, y = v => h - 4 - v * (h - 8);
  gg.strokeStyle = "rgba(142,151,138,.6)"; gg.lineWidth = 1;
  for (const b of SIM.hist) if (b.r && b.t >= t0){ gg.beginPath(); gg.moveTo(x(b.t), 0); gg.lineTo(x(b.t), h); gg.stroke(); }
  for (const [k, c] of [["v", B["graf-v"]], ["o", B["graf-o"]]]){
    gg.beginPath(); gg.lineWidth = 1.6; gg.strokeStyle = c; let prvni = true;
    for (const b of SIM.hist){ if (b.t < t0) continue; if (prvni){ gg.moveTo(x(b.t), y(b[k])); prvni = false; } else gg.lineTo(x(b.t), y(b[k])); }
    gg.stroke();
  }
}
function ukazatele(){
  const jede = SIM.faze === "jede", B = SIM.B, zpet = jede && B.smer < 0 && (B.rychlost > 0 || Number(plyn.value) < -2);
  let c = "–", p;
  if (SIM.faze === "start") p = t("sStartuje");
  else if (SIM.faze === "stop") p = t("sDobeh");
  else if (!jede) p = buf("motor_run") ? t("sStoji") : t("sVyberJizdu");
  else { c = zpet ? t("zpatecka1") : String(B.stupen); p = zpet ? t("sZpatecka") : B.rychlost === 0 ? t("sVolnobeh") : t("sStupenZ", {n:S.prevodovka.stupnu}); }
  $("sStupen").textContent = c; $("sStupen").classList.toggle("radi", SIM.t < SIM.radiDo); $("sPopis").textContent = p;
  const pr = Math.round(B.rychlost * 100);
  $("tRychlost").textContent = pr + " %"; $("vRychlost").style.width = pr + "%"; $("pRychlost").classList.toggle("vzad", zpet);
  $("tRate").textContent = jede ? fmt(SIM.rate, 2) + "×" : "–";
  $("vRate").style.width = (jede ? Math.round((SIM.rate - 1) / Math.max(0.01, S.prevodovka.max_rychlost - 1) * 100) : 0) + "%";
  $("pakaObal").classList.toggle("ne", !jede);
}

let posledni = 0;
function snimek(ms){
  requestAnimationFrame(snimek);
  const ted = ms / 1000; let dt = posledni ? ted - posledni : 0; posledni = ted;
  if (dt > 0.1) dt = 0.1;
  SIM.t += dt;
  if (SIM.demo) vedUkazku();
  let r = 0;
  if (SIM.faze === "jede" && dt > 0){
    r = krokPrevodovky(SIM.B, S.prevodovka, Number(plyn.value) / 100, dt);
    if (r) SIM.radiDo = SIM.t + 0.35;
    SIM.rate = Math.pow(S.prevodovka.max_rychlost, SIM.B.otacky);
    if (SIM.smycka) SIM.smycka.playbackRate.setTargetAtTime(SIM.rate, audio().currentTime, 0.03);
  }
  SIM.hist.push({t:SIM.t, o:SIM.B.otacky, v:SIM.B.rychlost, r});
  while (SIM.hist.length && SIM.hist[0].t < SIM.t - 11) SIM.hist.shift();
  kresliBudik(); kresliGraf(); ukazatele();
}

const ED = {jm:null, d:null, puvodni:null, zpet:[], znovu:[], v0:0, v1:1, a:null, b:null, kurzor:0,
            hra:null, tah:null, r:1, cache:null, cKlic:"", pKlic:"", pCache:null, info:null};
const edVlna = $("edVlna"), edPrehled = $("edPrehled");
const ZPET_MAX_BAJTU = 400e6;		// historie kroku nejvys ~400 MB (dlouhe pozadi)

function edTitulek(){ $("edNazev").innerHTML = `${t("edNazev")} <small>${t("s_" + ED.jm)}, ${ED.jm}.wav</small>`; }
function otevriEditor(jm){
  const z = zvuky[jm];
  if (!z || !z.buf) return;
  zastavNahled(); vypniSim();
  ED.jm = jm; ED.d = z.buf.getChannelData(0).slice(); ED.puvodni = ED.d;
  ED.zpet = []; ED.znovu = []; ED.a = ED.b = null; ED.kurzor = 0;
  ED.v0 = 0; ED.v1 = ED.d.length; ED.cKlic = ED.pKlic = ""; ED.info = null;
  edTitulek();
  $("edSmycka").checked = SLOTY[jm].smycka;
  $("edDb").value = 0; edDbText();
  $("editor").classList.add("otevren");
  edRozmery(); edObnov();
  $("edPrehrat").focus();
}
function zavriEditor(){
  edStop();
  $("editor").classList.remove("otevren");
  ED.jm = null; ED.d = ED.puvodni = null; ED.zpet = []; ED.znovu = []; ED.cache = ED.pCache = null;
}
const edOtevren = () => ED.jm !== null;

/* --- kroky a historie --- */
function edProved(fce){
  edStop();
  const nove = fce(ED.d);
  if (!nove || nove.length < 2){ hlaska(t("edNicNezustane"), true); return false; }
  ED.zpet.push(ED.d); ED.znovu = [];
  let bajtu = ED.zpet.reduce((s, x) => s + x.length * 4, 0);
  while (bajtu > ZPET_MAX_BAJTU && ED.zpet.length > 1) bajtu -= ED.zpet.shift().length * 4;
  ED.d = nove;
  edPoZmene();
  return true;
}
function edPoZmene(){
  const L = ED.d.length;
  if (ED.v1 > L){ const sp = ED.v1 - ED.v0; ED.v1 = L; ED.v0 = Math.max(0, L - sp); }
  if (ED.v1 - ED.v0 < 32){ ED.v0 = 0; ED.v1 = L; }
  if (ED.a != null){ ED.a = Math.min(ED.a, L); ED.b = Math.min(ED.b, L); if (ED.b - ED.a < 1) ED.a = ED.b = null; }
  ED.kurzor = Math.min(ED.kurzor, L);
  ED.info = null;
  edObnov();
}
function edZpet(){ if (!ED.zpet.length) return; edStop(); ED.znovu.push(ED.d); ED.d = ED.zpet.pop(); edPoZmene(); }
function edZnovu(){ if (!ED.znovu.length) return; edStop(); ED.zpet.push(ED.d); ED.d = ED.znovu.pop(); edPoZmene(); }
function edObnovit(){ if (ED.d !== ED.puvodni){ const p = ED.puvodni; edProved(() => p); ED.a = ED.b = null; edObnov(); } }

function edUloz(){
  if (ED.d !== ED.puvodni){
    const b = audio().createBuffer(1, ED.d.length, ED_RATE);
    b.getChannelData(0).set(ED.d);
    zvuky[ED.jm] = {buf:b, wav:vyrobWav(ED.d, ED_RATE), zdroj:"upraveno", chyba:null};
    vykresliVlnu(ED.jm); zmena(); obnovSim(); upravenaSada();
    hlaska(t("edUpraven", {jm:ED.jm, d:fmt(ED.d.length / ED_RATE, 2), b:$("btnUlozit").textContent}));
  }
  zavriEditor();
}
async function edZrus(){
  edStop();
  const zmeny = ED.d !== ED.puvodni;
  const v = await dialog({ikona:"pozor", nadpis: zmeny ? t("edZahoditNadpis") : t("edZavritNadpis"),
    text: t(zmeny ? "edZahoditText" : "edNezmenenText", {jm:esc(ED.jm)}),
    tlacitka: zmeny ? [{t:t("edZpetDoEditoru"), v:false, fokus:true}, {t:t("edUlozitUpravy"), v:"ulozit", hlavni:true}, {t:t("edZahoditZavrit"), v:true}]
                    : [{t:t("edZpetDoEditoru"), v:false}, {t:t("edZavrit"), v:true, hlavni:true}]});
  if (v === "ulozit") edUloz();
  else if (v) zavriEditor();
}

/* --- upravy --- */
const edUsek = () => ED.a != null ? [ED.a, ED.b] : [0, ED.d.length];
$("edSmaz").onclick = () => { const [a, b] = edUsek(); if (edProved(d => smazUsek(d, a, b))){ ED.a = ED.b = null; ED.kurzor = a; edObnov(); } };
$("edPonech").onclick = () => { const [a, b] = edUsek(); if (edProved(d => ponechUsek(d, a, b))){ ED.a = ED.b = null; ED.kurzor = 0; ED.v0 = 0; ED.v1 = ED.d.length; edObnov(); } };
$("edTicho").onclick = () => { const [a, b] = edUsek(); edProved(d => tichoUsek(d, a, b)); };
$("edNabeh").onclick = () => { const [a, b] = edUsek(); edProved(d => nabehUsek(d, a, b)); };
$("edDobeh").onclick = () => { const [a, b] = edUsek(); edProved(d => dobehUsek(d, a, b)); };
$("edZesil").onclick = () => {
  const dB = Number($("edDb").value); if (!dB) return;
  const [a, b] = edUsek();
  if (edProved(d => zesilUsek(d, a, b, dB))){ $("edDb").value = 0; edDbText(); }
};
$("edNorm").onclick = () => { const [a, b] = edUsek(); edProved(d => normalizujUsek(d, a, b)); };
$("edSmyckaUp").onclick = () => {
  const N = Math.round(Number($("edProlnuti").value) * ED_RATE);
  if (ED.d.length < N * 3){ hlaska(t("edKratky"), true); return; }
  if (edProved(d => plynulaSmycka(d, N))){ $("edSmycka").checked = true; hlaska(t("edProlnuto", {ms:fmt(N / ED_RATE * 1000, 0)})); }
};
$("edDC").onclick = () => edProved(d => bezDC(d));
function edDbText(){ const v = Number($("edDb").value); $("edDbV").textContent = (v > 0 ? "+" : v < 0 ? "−" : "") + fmt(Math.abs(v), 1) + " dB"; }
$("edDb").addEventListener("input", edDbText);
$("edZpet").onclick = edZpet; $("edZnovu").onclick = edZnovu; $("edObnovit").onclick = edObnovit;
$("edUlozit").onclick = edUloz; $("edZrusit").onclick = edZrus;

/* --- vyber a zobrazeni --- */
function edZoom(f, stred){
  const L = ED.d.length, sp = ED.v1 - ED.v0;
  const nsp = Math.max(64, Math.min(L, sp * f));
  if (stred == null) stred = ED.v0 + sp / 2;
  const podil = (stred - ED.v0) / sp;
  ED.v0 = stred - podil * nsp; ED.v1 = ED.v0 + nsp;
  edDrzZobrazeni(); edObnov();
}
function edPosun(o){ ED.v0 += o; ED.v1 += o; edDrzZobrazeni(); edObnov(); }
function edDrzZobrazeni(){
  const L = ED.d.length, sp = ED.v1 - ED.v0;
  if (ED.v0 < 0){ ED.v0 = 0; ED.v1 = sp; }
  if (ED.v1 > L){ ED.v1 = L; ED.v0 = Math.max(0, L - sp); }
}
$("edBliz").onclick = () => edZoom(0.5, ED.a != null ? (ED.a + ED.b) / 2 : null);
$("edDal").onclick = () => edZoom(2);
$("edCele").onclick = () => { ED.v0 = 0; ED.v1 = ED.d.length; edObnov(); };
$("edNaVyber").onclick = () => {
  if (ED.a == null) return;
  const okraj = (ED.b - ED.a) * 0.08;
  ED.v0 = ED.a - okraj; ED.v1 = ED.b + okraj; edDrzZobrazeni(); edObnov();
};
$("edVse").onclick = () => { ED.a = 0; ED.b = ED.d.length; edObnov(); };
$("edZrusVyber").onclick = () => { ED.a = ED.b = null; edObnov(); };

const edX2S = (x) => ED.v0 + x / edVlna.clientWidth * (ED.v1 - ED.v0);
const edS2X = (s) => (s - ED.v0) / (ED.v1 - ED.v0) * edVlna.clientWidth;
function edPrichyt(s){ return $("edNula").checked ? kNule(ED.d, s) : Math.round(s); }

edVlna.addEventListener("pointerdown", e => {
  const x = e.offsetX, s = Math.max(0, Math.min(ED.d.length, edX2S(x)));
  edVlna.setPointerCapture(e.pointerId);
  if (ED.a != null && Math.abs(x - edS2X(ED.a)) < 7) ED.tah = {typ:"a"};
  else if (ED.a != null && Math.abs(x - edS2X(ED.b)) < 7) ED.tah = {typ:"b"};
  else ED.tah = {typ:"novy", s0:s, x0:x, pohnul:false};
});
edVlna.addEventListener("pointermove", e => {
  const x = e.offsetX, s = Math.max(0, Math.min(ED.d.length, edX2S(x)));
  const tah = ED.tah;
  if (!tah){
    edVlna.style.cursor = ED.a != null && (Math.abs(x - edS2X(ED.a)) < 7 || Math.abs(x - edS2X(ED.b)) < 7) ? "ew-resize" : "text";
    return;
  }
  if (tah.typ === "novy"){
    if (!tah.pohnul && Math.abs(x - tah.x0) < 4) return;
    tah.pohnul = true; ED.a = Math.min(tah.s0, s); ED.b = Math.max(tah.s0, s);
  } else if (tah.typ === "a"){ ED.a = Math.min(s, ED.b - 1); }
  else { ED.b = Math.max(s, ED.a + 1); }
  edObnov();
});
function edPusteno(){
  const tah = ED.tah; ED.tah = null;
  if (!tah) return;
  if (tah.typ === "novy" && !tah.pohnul){
    ED.kurzor = Math.round(tah.s0); ED.a = ED.b = null;
    if (ED.hra){ edStop(); edPrehraj(); }		// kliknuti za prehravani = prehravat odtud
  } else if (ED.a != null){
    ED.a = edPrichyt(ED.a); ED.b = edPrichyt(ED.b);
    if (ED.b - ED.a < 2) ED.a = ED.b = null;
  }
  edObnov();
}
edVlna.addEventListener("pointerup", edPusteno);
edVlna.addEventListener("pointercancel", edPusteno);
edVlna.addEventListener("dblclick", () => { ED.a = 0; ED.b = ED.d.length; edObnov(); });
edVlna.addEventListener("wheel", e => {
  e.preventDefault();
  const sp = ED.v1 - ED.v0;
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) edPosun((e.deltaX || e.deltaY) / edVlna.clientWidth * sp);
  else edZoom(Math.exp(Math.max(-1, Math.min(1, e.deltaY * 0.003))), edX2S(e.offsetX));
}, {passive:false});

function edPrehledNa(e){
  const s = e.offsetX / edPrehled.clientWidth * ED.d.length, sp = ED.v1 - ED.v0;
  ED.v0 = s - sp / 2; ED.v1 = s + sp / 2; edDrzZobrazeni(); edObnov();
}
edPrehled.addEventListener("pointerdown", e => { edPrehled.setPointerCapture(e.pointerId); ED.tahPrehled = true; edPrehledNa(e); });
edPrehled.addEventListener("pointermove", e => { if (ED.tahPrehled) edPrehledNa(e); });
edPrehled.addEventListener("pointerup", () => ED.tahPrehled = false);

/* --- prehravani --- */
function edPrehraj(){
  if (ED.hra){ edStop(); return; }
  const c = audio(), src = c.createBufferSource(), b = c.createBuffer(1, ED.d.length, ED_RATE);
  b.getChannelData(0).set(ED.d);
  src.buffer = b;
  const g = c.createGain(); g.gain.value = 0.85; src.connect(g); g.connect(c.destination);
  const smycka = $("edSmycka").checked;
  let a = 0, k = ED.d.length, od = ED.kurzor;
  if (ED.a != null){ a = ED.a; k = ED.b; od = ED.a; }
  else if (od >= k - 1) od = 0;
  if (smycka){ src.loop = true; src.loopStart = a / ED_RATE; src.loopEnd = k / ED_RATE; src.start(0, od / ED_RATE); }
  else src.start(0, od / ED_RATE, (k - od) / ED_RATE);
  ED.hra = {src, t0:c.currentTime, od, a, k, smycka};
  src.onended = () => { if (ED.hra && ED.hra.src === src){ ED.hra = null; edObnov(); } };
  edObnov();
}
function edStop(){
  if (ED.hra){ const s = ED.hra.src; ED.hra = null; try{ s.stop(); }catch(e){} }
  if (edOtevren()) edObnov();
}
function edPoloha(){
  const h = ED.hra; if (!h) return null;
  let p = h.od + (audio().currentTime - h.t0) * ED_RATE;
  if (h.smycka && p >= h.k){ const L = Math.max(1, h.k - h.a); p = h.a + ((p - h.a) % L); }
  return Math.min(p, ED.d.length);
}
$("edPrehrat").onclick = edPrehraj;
$("edSmycka").addEventListener("change", () => { if (ED.hra){ edStop(); edPrehraj(); } });

/* --- klavesy --- */
document.addEventListener("keydown", e => {
  if (!edOtevren()) return;
  const cmd = e.metaKey || e.ctrlKey;
  if (cmd && (e.key === "z" || e.key === "Z")){ e.preventDefault(); e.shiftKey ? edZnovu() : edZpet(); return; }
  if (cmd && (e.key === "y" || e.key === "Y")){ e.preventDefault(); edZnovu(); return; }
  if (e.target.tagName === "SELECT") return;
  if (e.key === " " && !(e.target.tagName === "INPUT" && e.target.type === "checkbox")){ e.preventDefault(); edPrehraj(); }
  else if ((e.key === "Delete" || e.key === "Backspace") && ED.a != null){ e.preventDefault(); $("edSmaz").click(); }
  else if (e.key === "Escape"){ e.preventDefault(); if (ED.a != null){ ED.a = ED.b = null; edObnov(); } else edZrus(); }
});

/* --- vykresleni --- */
function edRozmery(){
  const r = window.devicePixelRatio || 1; ED.r = r;
  for (const c of [edVlna, edPrehled]){ c.width = Math.max(100, Math.round(c.clientWidth * r)); c.height = Math.round(c.clientHeight * r); }
  ED.cKlic = ED.pKlic = "";
}
window.addEventListener("resize", () => { if (edOtevren()){ edRozmery(); edObnov(); } });

function kresliPrubeh(g, d, v0, v1, w, h, barva){
  const spp = (v1 - v0) / w;
  g.fillStyle = barva; g.strokeStyle = barva;
  if (spp > 1){
    for (let x = 0; x < w; x++){
      const a = Math.max(0, Math.floor(v0 + x * spp)), b = Math.min(d.length, Math.floor(v0 + (x + 1) * spp) + 1);
      const krok = Math.max(1, Math.floor((b - a) / 512));
      let mn = 1, mx = -1;
      for (let i = a; i < b; i += krok){ const v = d[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
      if (mx < mn) continue;
      const y1 = (1 - mx) * h / 2, y2 = (1 - mn) * h / 2;
      g.fillRect(x, y1, 1, Math.max(1, y2 - y1));
    }
  } else {
    const i0 = Math.max(0, Math.floor(v0)), i1 = Math.min(d.length - 1, Math.ceil(v1));
    g.beginPath();
    for (let i = i0; i <= i1; i++){ const x = (i - v0) / spp, y = (1 - d[i]) * h / 2; i === i0 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.lineWidth = Math.max(1, ED.r * 1.2); g.stroke();
    if (spp < 0.12) for (let i = i0; i <= i1; i++){ const x = (i - v0) / spp, y = (1 - d[i]) * h / 2; g.fillRect(x - 2 * ED.r, y - 2 * ED.r, 4 * ED.r, 4 * ED.r); }
  }
}
function casText(s, krok){
  const x = s / ED_RATE, des = krok >= 1 ? 0 : krok >= 0.1 ? 1 : krok >= 0.01 ? 2 : 3;
  return x >= 60 ? `${Math.floor(x / 60)}:${fmt(x % 60, des).padStart(des ? des + 3 : 2, "0")}` : fmt(x, des);
}

function edKresli(){
  if (!edOtevren()) return;
  const g = edVlna.getContext("2d"), w = edVlna.width, h = edVlna.height, r = ED.r;
  const pas = 18 * r, hv = h - pas;			// nahore casova osa
  const X = s => (s - ED.v0) / (ED.v1 - ED.v0) * w;
  const klic = `${ED.v0}|${ED.v1}|${w}|${h}`;
  if (ED.cKlic !== klic || ED.cData !== ED.d){
    ED.cache ||= document.createElement("canvas");
    ED.cache.width = w; ED.cache.height = hv;
    const cg = ED.cache.getContext("2d");
    cg.clearRect(0, 0, w, hv);
    cg.fillStyle = "rgba(142,151,138,.22)";
    for (const y of [0.5, 0.25, 0.75]) cg.fillRect(0, Math.round(hv * y), w, y === 0.5 ? r : r * 0.5);
    kresliPrubeh(cg, ED.d, ED.v0, ED.v1, w, hv, "#A6B19A");
    ED.cKlic = klic; ED.cData = ED.d;
  }
  g.clearRect(0, 0, w, h);
  g.fillStyle = "#2B3028"; g.fillRect(0, 0, w, pas);
  const sp = (ED.v1 - ED.v0) / ED_RATE, kroky = [0.0005,0.001,0.002,0.005,0.01,0.02,0.05,0.1,0.2,0.5,1,2,5,10,15,30,60];
  const krok = kroky.find(k => k / sp * w >= 74 * r) || 60;
  g.font = `${11 * r}px "Avenir Next Condensed","Arial Narrow",sans-serif`; g.textBaseline = "middle";
  for (let q = Math.ceil(ED.v0 / ED_RATE / krok) * krok; q * ED_RATE <= ED.v1; q += krok){
    const x = X(q * ED_RATE);
    g.fillStyle = "#5C6556"; g.fillRect(x, pas - 5 * r, r, 5 * r);
    g.fillStyle = "#939C8D"; g.fillText(casText(q * ED_RATE, krok), x + 3 * r, pas / 2);
  }
  g.save(); g.translate(0, pas);
  if (ED.a != null){ const x1 = X(ED.a), x2 = X(ED.b); g.fillStyle = "rgba(200,162,60,.18)"; g.fillRect(x1, 0, x2 - x1, hv); }
  g.drawImage(ED.cache, 0, 0);
  if (ED.a != null){ g.fillStyle = "#C8A23C"; g.fillRect(X(ED.a) - r, 0, 2 * r, hv); g.fillRect(X(ED.b) - r, 0, 2 * r, hv); }
  if (ED.a == null){ g.fillStyle = "rgba(200,162,60,.75)"; for (let y = 0; y < hv; y += 6 * r) g.fillRect(X(ED.kurzor), y, r, 3 * r); }
  const p = edPoloha();
  if (p != null){ g.fillStyle = "#E0563B"; g.fillRect(X(p) - r, 0, 2 * r, hv); }
  g.restore();

  const pg = edPrehled.getContext("2d"), pw = edPrehled.width, ph = edPrehled.height;
  const pk = `${pw}|${ph}`;
  if (ED.pKlic !== pk || ED.pData !== ED.d){
    ED.pCache ||= document.createElement("canvas");
    ED.pCache.width = pw; ED.pCache.height = ph;
    const cg = ED.pCache.getContext("2d"); cg.clearRect(0, 0, pw, ph);
    kresliPrubeh(cg, ED.d, 0, ED.d.length, pw, ph, "#7D8873");
    ED.pKlic = pk; ED.pData = ED.d;
  }
  const PX = s => s / ED.d.length * pw;
  pg.clearRect(0, 0, pw, ph);
  if (ED.a != null){ pg.fillStyle = "rgba(200,162,60,.22)"; pg.fillRect(PX(ED.a), 0, Math.max(r, PX(ED.b) - PX(ED.a)), ph); }
  pg.drawImage(ED.pCache, 0, 0);
  pg.fillStyle = "rgba(255,255,255,.07)"; pg.fillRect(PX(ED.v0), 0, PX(ED.v1) - PX(ED.v0), ph);
  pg.strokeStyle = "#C8A23C"; pg.lineWidth = r; pg.strokeRect(PX(ED.v0) + r / 2, r / 2, Math.max(2 * r, PX(ED.v1) - PX(ED.v0) - r), ph - r);
  if (p != null){ pg.fillStyle = "#E0563B"; pg.fillRect(PX(p), 0, r, ph); }
}

function edObnov(){
  if (!edOtevren()) return;
  const L = ED.d.length, vyber = ED.a != null;
  const infoKlic = `${ED.a}|${ED.b}|${L}|${LANG}`;
  if (!ED.info || ED.infoKlic !== infoKlic || ED.infoData !== ED.d){
    ED.infoKlic = infoKlic; ED.infoData = ED.d;
    const [a, b] = edUsek(), m = spicka(ED.d, a, b);
    ED.info = m > 0 ? `${vyber ? t("edSpickaVyberu") : t("edSpicka")} ${m >= 0.9999 ? fmt(0, 1) : "−" + fmt(-20 * Math.log10(m), 1)} dB` : t("edTicho");
  }
  const q = s => fmt(s / ED_RATE, 2);
  $("edCas").innerHTML = `${t("edDelka")} <b>${q(L)} s</b> · ` +
    (vyber ? `${t("edVyberInfo")} <b>${q(ED.a)}–${q(ED.b)} s</b> (${q(ED.b - ED.a)} s)` : `${t("edKurzor")} ${q(ED.kurzor)} s`) + ` · ${ED.info}`;
  document.querySelectorAll("#editor [data-sel]").forEach(b => b.disabled = !vyber);
  $("edHlCil").textContent = vyber ? t("vyberCil") : t("celyZvuk");
  $("edZpet").disabled = !ED.zpet.length; $("edZnovu").disabled = !ED.znovu.length;
  $("edObnovit").disabled = ED.d === ED.puvodni;
  $("edNaVyber").disabled = !vyber; $("edZrusVyber").disabled = !vyber;
  $("edPrehrat").textContent = ED.hra ? t("edZastavit") : vyber ? t("edPrehratVyber") : t("edPrehrat");
  $("edPrehrat").classList.toggle("hraje", !!ED.hra);
  ED.prekreslit = true;
}
function edSnimek(){
  requestAnimationFrame(edSnimek);
  if (edOtevren() && (ED.prekreslit || ED.hra)){ ED.prekreslit = false; edKresli(); }
}
requestAnimationFrame(edSnimek);

/* ---------- start ---------- */
napojPrepinac("zarizeni", "zarizeni");
napojPrepinac("reproduktor", "reproduktor");
prelozStatiku();
vykresliFunkce();
vykresliPrevodovku();
for (const jm of Object.keys(SLOTY)) zvuky[jm] = {buf:null, wav:null, chyba:null};
rozmery();
obnovVse();
requestAnimationFrame(snimek);
$("uvOtevrit").focus();

})();

if (typeof module !== "undefined") module.exports = {konfigSady, pouzijKonfigSady, nastavRezim, platnyNazevSady, T_TRUCK, vychozi, nactiIni, vyrobIni, kontrola, duplicity, vyrobWav, vyrobZip, crc32, krokPrevodovky, novaPrevodovka, FUNKCE, PREVOD, T, nastavJazyk,
  kNule, smazUsek, ponechUsek, tichoUsek, nabehUsek, dobehUsek, zesilUsek, normalizujUsek, bezDC, plynulaSmycka, spicka};
</script>

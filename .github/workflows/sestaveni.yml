# Po kazdem pushi sestavi obsah SD karty. Hotovy ZIP je na GitHubu v zalozce
# Actions -> posledni beh -> Artifacts -> SBusSound_karta.
name: Sestaveni

on:
  push:
  workflow_dispatch:

jobs:
  sestav:
    runs-on: ubuntu-latest
    steps:
      - name: Stazeni kodu vcetne knihovny Circle
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prekladac ARM (xPack GCC 14.2.1)
        run: |
          curl -sSfL -o gcc.tgz https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz
          mkdir -p "$HOME/gcc"
          tar xzf gcc.tgz -C "$HOME/gcc" --strip-components=1
          echo "$HOME/gcc/bin" >> "$GITHUB_PATH"

      - name: Sestaveni
        run: ./sestav.sh

      - name: Obsah karty ke stazeni
        uses: actions/upload-artifact@v4
        with:
          name: SBusSound_karta
          path: vystup/karta/
